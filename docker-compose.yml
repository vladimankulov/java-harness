services:
  ollama:
    image: ollama/ollama:latest
    container_name: harness-ollama
    ports:
      - "11431:11434"
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - harness-net
    environment:
      # Модель не выгружается между ходами агента: иначе каждый ход
      # начинается с повторной загрузки весов в VRAM.
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MLX=1
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: harness-ollama-pull
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - harness-net
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command: -c "ollama pull qwen3.5:2b"

networks:
  harness-net:
    name: harness-net
