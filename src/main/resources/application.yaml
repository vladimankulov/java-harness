spring:
  application:
    name: harness
  main:
    # Агент живёт в терминале, а не в вебе: без этого Boot поднял бы сервлет-контейнер,
    # если веб-стартер притянется транзитивно.
    web-application-type: none
    banner-mode: off
  ai:
    ollama:
      base-url: http://localhost:11431
      chat:
        think: false
        temperature: 0.2
        model: qwen3.5:2b
        num-ctx: 16384

harness:
  agent:
    max-turns: 20
    working-directory: "."
    personality-enabled: false
  permission:
    mode: default

logging:
  level:
    root: WARN
    com.harness: INFO
  pattern:
    console: "%msg%n"
